name: Generate Proto Code

on:
    workflow_dispatch:

jobs:
    generate:
        runs-on: ubuntu-latest
        steps:
            - name: Install Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"

            - name: Install protoc
              run: |
                  sudo apt-get update
                  sudo apt-get install -y protobuf-compiler
                  go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
                  go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
                  echo "$HOME/go/bin" >> $GITHUB_PATH

            - name: Clone Proto Files Repository
              run: git clone https://github.com/Talan-Application/proto-files.git

            - name: Generate Go Code from Proto Files
              run: |
                  mkdir -p gen/auth/v1

                  protoc \
                    --proto_path=proto-files/proto \
                    --go_out=gen \
                    --go_opt=paths=source_relative \
                    --go-grpc_out=gen \
                    --go-grpc_opt=paths=source_relative \
                    proto-files/proto/auth/v1/auth.proto

            - name: Clone Generator Repository
              run: |
                  git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/Talan-Application/proto-generation.git out

            - name: Create go.mod in generated repo
              run: |
                  cd out
                  cat > go.mod << 'EOF'
                  module github.com/Talan-Application/proto-generation.git

                  go 1.21

                  require (
                    google.golang.org/grpc v1.60.0
                    google.golang.org/protobuf v1.31.0
                  )
                  EOF
                  go mod tidy

            - name: Push Generated Files
              run: |
                  cp -r gen/* out/
                  cd out
                  git config user.email "ci@github.com"
                  git config user.name "GitHub Actions"
                  git add .
                  git diff --staged --quiet || git commit -m "regen from proto"
                  git push
